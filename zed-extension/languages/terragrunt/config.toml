name = "Terragrunt"
grammar = "hcl"
path_suffixes = [
  "terragrunt.hcl",
  "root.hcl",
  "terragrunt.stack.hcl",
  "terragrunt.values.hcl",
]
line_comments = ["# ", "// "]
block_comment = ["/*", "*/"]
autoclose_before = ",}])"
brackets = [
  { start = "{", end = "}", close = true, newline = true },
  { start = "[", end = "]", close = true, newline = true },
  { start = "(", end = ")", close = true, newline = true },
  { start = "\"", end = "\"", close = true, newline = false, not_in = [
    "comment",
    "string",
  ] },
  { start = "'", end = "'", close = true, newline = false, not_in = [
    "comment",
    "string",
  ] },
  { start = "/*", end = " */", close = true, newline = false, not_in = [
    "comment",
    "string",
  ] },
]
tab_size = 2
