  build-zed:
    name: Package Zed extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up mise
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          version: 2025.6.8

      - name: Install Zed WebAssembly target
        run: rustup target add wasm32-wasip1

      - name: Build Zed extension
        run: cargo build --locked --release --target wasm32-wasip1 --manifest-path zed-extension/Cargo.toml

      - name: Test Zed extension
        run: cargo test --locked --manifest-path zed-extension/Cargo.toml

      - name: Resolve package tag
        id: package
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
          else
            version="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' zed-extension/extension.toml | head -1)"
            tag="v${version}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Package Zed extension
        run: make release-package-zed TAG="${{ steps.package.outputs.tag }}"

      - name: Upload Zed extension to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: gh release upload "$GITHUB_REF_NAME" dist/terragrunt-ls-zed-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Zed extension as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zed-extension
          path: dist/terragrunt-ls-zed-*.zip
